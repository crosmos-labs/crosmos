name: Bug report
description: Report a bug in apps/app or @crosmos/graph.
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - "@crosmos/graph"
        - apps/app
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit SHA
      placeholder: "@crosmos/graph@0.0.4"

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
