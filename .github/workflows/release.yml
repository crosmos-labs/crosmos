name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      paths_released: ${{ steps.rp.outputs.paths_released }}
      tag_name: ${{ steps.rp.outputs['packages/graph--tag_name'] }}
      version: ${{ steps.rp.outputs['packages/graph--version'] }}
    steps:
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    name: publish-npm (manual approval)
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-npm
      url: https://www.npmjs.com/package/@crosmos/graph
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (provenance support)
        run: npm install -g npm@latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck --filter=@crosmos/graph

      - name: Build
        run: bun run build --filter=@crosmos/graph

      - name: publint
        run: bunx publint packages/graph

      - name: Are The Types Wrong
        working-directory: packages/graph
        run: bunx --bun @arethetypeswrong/cli --pack .

      - name: Publish to npm
        working-directory: packages/graph
        run: npm publish --access public --provenance

  post-release:
    name: post-release
    needs: [release-please, publish-npm]
    if: needs.release-please.outputs.releases_created == 'true' && needs.publish-npm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Open back-merge PR (main -> dev)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-release-to-dev
          base: dev
          title: "chore: sync release ${{ needs.release-please.outputs.tag_name }} to dev"
          body: |
            Auto-generated by the release workflow after publishing `${{ needs.release-please.outputs.tag_name }}` to npm.

            Brings the version bump from `main` back to `dev` so the next release cycle starts from an aligned state.
          commit-message: "chore: sync release ${{ needs.release-please.outputs.tag_name }} to dev"
          delete-branch: true
